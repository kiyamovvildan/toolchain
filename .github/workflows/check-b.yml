# check-b — тонкий прокси: сборка второго контроллера (esp-idf v5.2.2).
# Код сборки и исходники — в приватном source (клон через секрет).
name: check-b
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-b
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Source (приватный) через секрет
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
        run: git clone --depth=1 "https://x-access-token:${SOURCE_PUSH_TOKEN}@github.com/kiyamovvildan/source.git" "$GITHUB_WORKSPACE/src"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32
          path: src/firmware/titan-esp32
      - name: Стирание предыдущих прогонов (логов)
        if: always()
        env:
          CI_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for RID in $(curl -sf -H "Authorization: token $CI_TOKEN" -H "User-Agent: ci" \
            "https://api.github.com/repos/kiyamovvildan/toolchain/actions/runs?per_page=20" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(str(r['id']) for r in d.get('workflow_runs',[]) if r['name']=='check-b'))"); do
            [ "$RID" = "$RUN_ID" ] && continue
            curl -sf -X DELETE -H "Authorization: token $CI_TOKEN" -H "User-Agent: ci" \
              "https://api.github.com/repos/kiyamovvildan/toolchain/actions/runs/$RID" || true
          done
          sudo rm -rf "$GITHUB_WORKSPACE/src"
