name: check-c
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Имя задания (ci/jobs/<job>.sh в source)'
        required: true
        type: string
      branch:
        description: 'Ветка source'
        required: false
        default: 'main'
        type: string
permissions:
  contents: read
concurrency:
  group: check-c
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/opt/openEMS
            /home/runner/.local/lib/python3.12/site-packages
          key: openems-build-v1
      - name: Source (приватный) + запуск (код — в source/ci/)
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
          TOOLCHAIN: ${{ github.workspace }}
        run: |
          git clone --depth=1 "https://x-access-token:${SOURCE_PUSH_TOKEN}@github.com/kiyamovvildan/source.git" /tmp/meta
          bash /tmp/meta/ci/kicad-jobs.sh "${{ inputs.job }}" "${{ inputs.branch }}"
      - name: Стирание предыдущих прогонов (логов)
        if: always()
        env:
          CI_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for RID in $(curl -sf -H "Authorization: token $CI_TOKEN" -H "User-Agent: ci" \
            "https://api.github.com/repos/kiyamovvildan/toolchain/actions/runs?per_page=30" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(str(r['id']) for r in d.get('workflow_runs',[]) if r['name']=='check-c'))"); do
            [ "$RID" = "$RUN_ID" ] && continue
            curl -sf -X DELETE -H "Authorization: token $CI_TOKEN" -H "User-Agent: ci" \
              "https://api.github.com/repos/kiyamovvildan/toolchain/actions/runs/$RID" || true
          done
          rm -rf /tmp/src /tmp/source /tmp/squashfs-root /tmp/KiCad.AppImage
