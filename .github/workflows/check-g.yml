# check-g — сборка APK (только dispatch; код и исходники — в приватном source).
name: check-g
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Source (приватный) через секрет
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
        run: git clone --depth 1 --branch display-unification "https://x-access-token:${SOURCE_PUSH_TOKEN}@github.com/kiyamovvildan/source.git" "$GITHUB_WORKSPACE/src"
      - name: Android SDK (cmdline-tools вручную, setup-android@v3 битый)
        run: |
          set -e
          curl -sfL -o /tmp/ct.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          unzip -q /tmp/ct.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
          ls "$ANDROID_SDK_ROOT/platforms"
      - name: Сборка APK
        working-directory: src/EMELYA-App
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "SDK root: $ANDROID_SDK_ROOT"; ls "$ANDROID_SDK_ROOT"
          gradle assembleDebug --no-daemon
      - name: Кладём APK в source
        working-directory: src
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
        run: |
          mkdir -p android
          cp EMELYA-App/app/build/outputs/apk/debug/app-debug.apk "android/EMELYA-app-debug-$(date +%Y%m%d-%H%M).apk"
          git config user.email "ci@local" && git config user.name "ci"
          git add android/ && git commit -m "ci: APK (check-g)" && git push
      - name: Стирание предыдущих прогонов
        if: always()
        env:
          CI_TOKEN: ${{ secrets.SOURCE_PUSH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for RID in $(curl -sf -H "Authorization: token $CI_TOKEN" -H "User-Agent: ci" \
            "https://api.github.com/repos/kiyamovvildan/toolchain/actions/runs?per_page=20" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(str(r['id']) for r in d.get('workflow_runs',[]) if r['name']=='check-g'))"); do
            [ "$RID" = "$RUN_ID" ] && continue
            curl -sf -X DELETE -H "Authorization: token $CI_TOKEN" -H "User-Agent: ci" \
              "https://api.github.com/repos/kiyamovvildan/toolchain/actions/runs/$RID" || true
          done
